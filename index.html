<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }.login-box {
  background: rgba(255,255,255,0.15);
  padding: 40px;
  width: 350px;
  backdrop-filter: blur(8px);
  border-radius: 20px;
  box-shadow: 0 0 15px rgba(0,0,0,0.3);
  text-align: center;
}

h2 {
  margin-bottom: 25px;
  font-weight: bold;
}

.btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  margin-top: 12px;
  font-size: 16px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

.btn-google {
  background: #fff;
  color: #444;
}

.btn-facebook {
  background: #1877f2;
  color: #fff;
}

.btn:hover {
  transform: scale(1.03);
}

  </style>
</head>
<body>  <div class="login-box">
    <h2>Bem-vindo</h2><input id="usuario" type="text" placeholder="Usuário" style="width:100%;padding:12px;border:none;border-radius:10px;margin-bottom:10px;">
<input id="senha" type="password" placeholder="Senha" style="width:100%;padding:12px;border:none;border-radius:10px;margin-bottom:12px;">
<button class="btn" style="background:#111;color:#fff;" onclick="loginPadrao()">Entrar</button>

<hr style="margin:20px 0;border:0;border-top:1px solid rgba(255,255,255,0.3);">

<button class="btn btn-google" onclick="loginGoogle()">Entrar com Google</button>
<button class="btn btn-facebook" onclick="loginFacebook()">Entrar com Facebook</button>

  </div><script>
  function loginPadrao() {
    const user = document.getElementById("usuario").value;
    const pass = document.getElementById("senha").value;

    if(user === "admin" && pass === "1234"){
      localStorage.setItem("usuarioLogado", JSON.stringify({nome: user, metodo: "padrao"}));
      window.location.href = "paineladmin.html";
    } else {
      alert("Usuário ou senha incorretos!");
    }
  }
</script><script type="module">>
  function loginGoogle() {
    alert("Integração real do Google será adicionada aqui.");
  }
  function loginFacebook() {
    alert("Integração real do Facebook será adicionada aqui.");
  }
</script>  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, FacebookAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC4AAbC8vCFAmlPlur12Nm7YBKPjaSjumM",
      authDomain: "meuappweb-65522.firebaseapp.com",
      projectId: "meuappweb-65522",
      storageBucket: "meuappweb-65522.firebasestorage.app",
      messagingSenderId: "305368794616",
      appId: "1:305368794616:web:d987589863479e576ac20d",
      measurementId: "G-L0VWMGJ003"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    function loginGoogle() {
      const provider = new GoogleAuthProvider();
      signInWithPopup(auth, provider)
        .then((result) => {
          const user = result.user;
          localStorage.setItem("usuarioLogado", JSON.stringify(user));
          window.location.href = "paineladmin.html";
        })
        .catch((error) => {
          alert("Erro ao tentar login com Google: " + error.message);
        });
    }

    function loginFacebook() {
      const provider = new FacebookAuthProvider();
      signInWithPopup(auth, provider)
        .then((result) => {
          const user = result.user;
          localStorage.setItem("usuarioLogado", JSON.stringify(user));
          window.location.href = "paineladmin.html";
        })
        .catch((error) => {
          alert("Erro ao tentar login com Facebook: " + error.message);
        });
    }

    window.loginGoogle = loginGoogle;
    window.loginFacebook = loginFacebook;
  </script></body>
</html>
