<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receitas</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f4f4; padding:20px; }
    .container { max-width:900px; margin:auto; background:#fff; padding:20px; border-radius:10px; }
    h2 { text-align:center; }
    label { font-weight:bold; }
    input, button { padding:10px; margin:5px 0; width:100%; }
    table { width:100%; border-collapse:collapse; margin-top:20px; }
    table, th, td { border:1px solid #ccc; }
    th, td { padding:10px; text-align:center; }
    .btn-edit { background:#2196f3; color:#fff; }
    .btn-delete { background:#f44336; color:#fff; }
    .btn-add { background:#4caf50; color:#fff; width:auto; }
  </style>
</head>
<body>
<div class="container">
  <h2>Controle de Receitas</h2><label>Data:</label> <input type="date" id="data">

<label>Descrição:</label> <input type="text" id="descricao" placeholder="Descrição da receita">

<label>Valor:</label> <input type="number" id="valor" step="0.01" placeholder="0.00">

<button class="btn-add" onclick="adicionarReceita()">Adicionar Receita</button>

  <h3>Filtro por Data</h3>
  <label>De:</label>
  <input type="date" id="dataDe">
  <label>Até:</label>
  <input type="date" id="dataAte">
  <button onclick="consultarReceitas()">Consultar</button>
  <button onclick="imprimirPDF()">Imprimir PDF</button>  <table id="tabelaReceitas">
    <thead>
      <tr>
        <th>Data</th>
        <th>Descrição</th>
        <th>Valor</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div><script>
let receitas = JSON.parse(localStorage.getItem('receitas')) || [];
renderTabela(receitas);

function adicionarReceita() {
  const data = document.getElementById('data').value;
  const descricao = document.getElementById('descricao').value;
  const valor = parseFloat(document.getElementById('valor').value);
  if (!data || !descricao || isNaN(valor)) return alert("Preencha todos os campos!");

  receitas.push({ id: Date.now(), data, descricao, valor });
  salvar();
  renderTabela(receitas);
  limparCampos();
}

function limparCampos() {
  document.getElementById('data').value = '';
  document.getElementById('descricao').value = '';
  document.getElementById('valor').value = '';
}

function salvar() {
  localStorage.setItem('receitas', JSON.stringify(receitas));
}

function renderTabela(lista) {
  const tbody = document.querySelector('#tabelaReceitas tbody');
  tbody.innerHTML = '';
  lista.forEach(item => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.data}</td>
      <td>${item.descricao}</td>
      <td>R$ ${item.valor.toFixed(2)}</td>
      <td>
        <button class="btn-edit" onclick="editarReceita(${item.id})">Editar</button>
        <button class="btn-delete" onclick="excluirReceita(${item.id})">Excluir</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function editarReceita(id) {
  const receita = receitas.find(r => r.id === id);
  if (!receita) return;
  document.getElementById('data').value = receita.data;
  document.getElementById('descricao').value = receita.descricao;
  document.getElementById('valor').value = receita.valor;
  excluirReceita(id);
}

function excluirReceita(id) {
  receitas = receitas.filter(r => r.id !== id);
  salvar();
  renderTabela(receitas);
}

function consultarReceitas() {
  const de = document.getElementById('dataDe').value;
  const ate = document.getElementById('dataAte').value;
  if (!de || !ate) return alert("Informe o período!");

  const filtradas = receitas.filter(r => r.data >= de && r.data <= ate);
  renderTabela(filtradas);
}

function imprimirPDF() {
  alert("PDF será gerado aqui — posso ativar totalmente quando quiser.");
}
</script></body>
</html>
